<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Prisma</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Red+Hat+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --plaster: #ffffff;
      --ink: #141414;
      --muted: #5a5754;
      --rule: #e4e4e4;
      --cadmium: #e63e11;
      --rail: 20.5rem;
      --gutter: 0.65rem;
      --font-display: "Newsreader", "Iowan Old Style", "Times New Roman", serif;
      --font-ui: "Figtree", "Helvetica Neue", sans-serif;
      --font-mono: "Red Hat Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
    }

    body.dragging { user-select: none; cursor: grabbing; }

    button, input { font: inherit; color: inherit; }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--rail);
      grid-template-areas: "stage rail";
      width: 100%;
      height: 100dvh;
      min-height: 0;
    }

    .stage {
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--plaster);
      padding:
        max(var(--gutter), env(safe-area-inset-top, 0px))
        var(--gutter)
        max(var(--gutter), env(safe-area-inset-bottom, 0px))
        max(var(--gutter), env(safe-area-inset-left, 0px));
    }

    .wall {
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(var(--swatch-count, 2), minmax(0, 1fr));
      gap: var(--gutter);
      width: 100%;
      height: 100%;
    }

    .swatch {
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 0;
      cursor: pointer;
      padding: 0.9rem 1rem 1rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-start;
      gap: 0.15rem;
      text-align: left;
      background: none;
    }

    .swatch:focus-visible,
    .pattern-btn:focus-visible {
      outline: 2px solid var(--cadmium);
      outline-offset: 3px;
    }

    .swatch.copied {
      box-shadow: inset 0 0 0 3px var(--cadmium);
    }

    .swatch-name {
      font-family: var(--font-display);
      font-size: clamp(1.05rem, 1.6vw, 1.55rem);
      font-weight: 500;
      font-variation-settings: "opsz" 48;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .hex {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
      opacity: 0.88;
      white-space: nowrap;
    }

    .hex.copied { opacity: 1; }

    .rail {
      grid-area: rail;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      background: var(--bg);
      border-left: 1px solid var(--rule);
      padding:
        max(1.1rem, env(safe-area-inset-top, 0px))
        max(1.2rem, env(safe-area-inset-right, 0px))
        max(1.1rem, env(safe-area-inset-bottom, 0px))
        1.2rem;
      overflow: hidden;
    }

    .rail-mast {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.65rem;
      font-variation-settings: "opsz" 36;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .pigment {
      width: 0.48em;
      height: 0.48em;
      background: var(--cadmium);
      flex-shrink: 0;
    }

    .readout {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    .scheme-label {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 1.35rem;
      font-variation-settings: "opsz" 28;
      letter-spacing: -0.025em;
      line-height: 1.15;
      flex-shrink: 0;
    }

    .ring-wrap {
      position: relative;
      width: min(100%, 10.25rem);
      aspect-ratio: 1;
      flex-shrink: 0;
      align-self: center;
      container-type: size;
    }

    .ring-wrap.dragging #ring { cursor: grabbing; }

    #ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      cursor: crosshair;
      touch-action: none;
      display: block;
    }

    .thumb {
      position: absolute;
      width: clamp(14px, 5.5cqi, 18px);
      height: clamp(14px, 5.5cqi, 18px);
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 1.5px var(--ink);
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .sliders {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      flex-shrink: 0;
    }

    .slider-row { display: flex; flex-direction: column; gap: 0.22rem; }
    .slider-row label {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
    }
    .slider-row label span:last-child {
      font-family: var(--font-mono);
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    input[type="range"] {
      width: 100%;
      height: 1.25rem;
      margin: 0;
      accent-color: var(--cadmium);
      cursor: pointer;
    }

    .pattern-toggle {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      min-height: 0;
      flex: 1 1 auto;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
    }

    .pattern-btn {
      width: 100%;
      padding: 0.22rem 0;
      font-size: 0.86rem;
      font-weight: 500;
      line-height: 1.25;
      text-align: left;
      background: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .pattern-btn:hover { color: var(--ink); }
    .pattern-btn.active {
      color: var(--ink);
      border-bottom-color: var(--cadmium);
    }

    @media (max-width: 840px) {
      :root { --rail: 18.5rem; --gutter: 0.55rem; }
      .wordmark { font-size: 1.45rem; }
      .scheme-label { font-size: 1.2rem; }
      .swatch { padding: 0.7rem 0.8rem 0.8rem; }
      .swatch-name { font-size: 1.05rem; }
    }

    @media (max-width: 720px) {
      :root { --gutter: 0.45rem; }

      .app {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) auto;
        grid-template-areas:
          "stage"
          "rail";
      }

      .wall {
        grid-template-columns: repeat(auto-fit, minmax(6.75rem, 1fr));
      }

      .rail {
        border-left: none;
        border-top: 1px solid var(--rule);
        max-height: 42dvh;
        overflow-y: auto;
        gap: 0.55rem;
        padding:
          0.7rem
          max(0.85rem, env(safe-area-inset-right, 0px))
          max(0.75rem, env(safe-area-inset-bottom, 0px))
          max(0.85rem, env(safe-area-inset-left, 0px));
      }

      .ring-wrap {
        width: min(100%, 6.75rem);
      }

      .sliders {
        flex-direction: row;
        gap: 0.75rem;
      }

      .slider-row { flex: 1; min-width: 0; }

      .pattern-toggle {
        flex: 0 0 auto;
        max-height: 7.5rem;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 0.15rem 0.85rem;
        overflow-y: auto;
      }

      .pattern-btn {
        width: auto;
        padding: 0.2rem 0;
      }
    }

    @media (max-width: 720px) and (max-height: 520px),
           (orientation: landscape) and (max-height: 520px) {
      .app {
        grid-template-columns: minmax(0, 1fr) minmax(16rem, 40vw);
        grid-template-rows: 100dvh;
        grid-template-areas: "stage rail";
      }

      .rail {
        border-left: 1px solid var(--rule);
        border-top: none;
        max-height: none;
        overflow: hidden;
      }

      .pattern-toggle {
        flex: 1 1 auto;
        max-height: none;
        flex-direction: column;
        flex-wrap: nowrap;
        gap: 0.05rem;
      }

      .pattern-btn { width: 100%; }

      .ring-wrap { width: min(100%, 8.5rem); }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="stage" aria-label="Palette">
      <div class="wall" id="output"></div>
    </section>

    <aside class="rail">
      <header class="rail-mast">
        <div class="wordmark"><span class="pigment" aria-hidden="true"></span>Prisma</div>
        <div class="readout" id="hueVal">0.0°</div>
      </header>

      <div class="scheme-label" id="schemeLabel"></div>

      <div class="ring-wrap" id="ringWrap">
        <canvas id="ring" width="560" height="560"></canvas>
        <div class="thumb" id="thumb"></div>
      </div>

      <div class="sliders">
        <div class="slider-row">
          <label><span>Saturation</span><span id="satVal">65.0</span></label>
          <input type="range" id="saturation" min="0" max="100" step="0.1" value="65" />
        </div>
        <div class="slider-row">
          <label><span>Lightness</span><span id="lightVal">55.0</span></label>
          <input type="range" id="lightness" min="0" max="100" step="0.1" value="55" />
        </div>
      </div>

      <div class="pattern-toggle" id="patternToggle"></div>
    </aside>
  </div>
  <script>
    const COF_SEMITONES = [0, 7, 2, 9, 4, 11, 6, 1, 8, 3, 10, 5];
    const INTERVALS = {
      0: "Root",
      1: "Minor 2nd",
      2: "Major 2nd",
      3: "Minor 3rd",
      4: "Major 3rd",
      5: "Fourth",
      6: "Tritone",
      7: "Fifth",
      8: "Minor 6th",
      9: "Major 6th",
      10: "Minor 7th",
      11: "Major 7th",
    };
    const PATTERNS = [
      { name: "Power Fifth", semitones: [0, 7] },
      { name: "Major Triad", semitones: [0, 4, 7] },
      { name: "Minor Triad", semitones: [0, 3, 7] },
      { name: "Major Pentatonic", semitones: [0, 2, 4, 7, 9] },
      { name: "Major 7th", semitones: [0, 4, 7, 11] },
      { name: "Dorian", semitones: [0, 3, 7, 9] },
      { name: "Sus4", semitones: [0, 5, 7] },
      { name: "Minor Pentatonic", semitones: [0, 3, 5, 7, 10] },
      { name: "Dom 7th", semitones: [0, 4, 7, 10] },
      { name: "Min 7th", semitones: [0, 3, 7, 10] },
      { name: "Lydian", semitones: [0, 4, 6, 11] },
      { name: "Phrygian", semitones: [0, 1, 3, 7] },
      { name: "Augmented", semitones: [0, 4, 8] },
      { name: "Whole Tone", semitones: [0, 2, 4, 6, 8, 10] },
    ];
    const DEFAULT_STATE = { pattern: 0, baseHue: 0, saturation: 65, lightness: 55 };
    const STORAGE_KEY = "prisma-palette-v1";
    const state = { ...DEFAULT_STATE };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (typeof saved.pattern === "number") state.pattern = saved.pattern;
        if (typeof saved.baseHue === "number") state.baseHue = saved.baseHue;
        if (typeof saved.saturation === "number") state.saturation = saved.saturation;
        if (typeof saved.lightness === "number") state.lightness = saved.lightness;
      } catch (_) {}
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (_) {}
    }

    function applyStateToControls() {
      document.getElementById("saturation").value = String(state.saturation);
      document.getElementById("lightness").value = String(state.lightness);
    }
    const canvas = document.getElementById("ring");
    const ringWrap = document.getElementById("ringWrap");
    const ctx = canvas.getContext("2d");
    const thumb = document.getElementById("thumb");
    const SIZE = 280, CX = SIZE, CY = SIZE, OUTER = SIZE - 8, INNER = SIZE - 52;

    function fmtVal(n) { return n.toFixed(1); }
    function semitoneToCofIndex(s) { return COF_SEMITONES.indexOf(((s % 12) + 12) % 12); }
    function cofIndexToHue(k, baseHue) { return (((baseHue + k * 30) % 360) + 360) % 360; }

    function getPalette() {
      const semitones = PATTERNS[state.pattern].semitones;
      const cofIndices = [...new Set(semitones.map(semitoneToCofIndex))].sort((a, b) => a - b);
      return cofIndices.map((k) => {
        const hue = cofIndexToHue(k, state.baseHue);
        const hex = hslToHex(hue, state.saturation, state.lightness);
        return { hue, hex, name: INTERVALS[COF_SEMITONES[k]] };
      });
    }

    function hslToHex(h, s, l) {
      s /= 100; l /= 100;
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      const m = l - c / 2;
      let r, g, b;
      if (h < 60) [r, g, b] = [c, x, 0];
      else if (h < 120) [r, g, b] = [x, c, 0];
      else if (h < 180) [r, g, b] = [0, c, x];
      else if (h < 240) [r, g, b] = [0, x, c];
      else if (h < 300) [r, g, b] = [x, 0, c];
      else [r, g, b] = [c, 0, x];
      const hex = (v) => Math.round((v + m) * 255).toString(16).padStart(2, "0");
      return `#${hex(r)}${hex(g)}${hex(b)}`;
    }

    function hexLuma(hex) {
      const n = parseInt(hex.slice(1), 16);
      const r = ((n >> 16) & 255) / 255;
      const g = ((n >> 8) & 255) / 255;
      const b = (n & 255) / 255;
      const lin = (v) => (v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
      return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
    }

    function captionInk(hex) {
      return hexLuma(hex) > 0.45 ? "#141414" : "#f7f7f7";
    }

    function drawRing() {
      const scale = canvas.width / (SIZE * 2);
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.clearRect(0, 0, SIZE * 2, SIZE * 2);
      for (let deg = 0; deg < 360; deg++) {
        const a0 = ((deg - 90) * Math.PI) / 180;
        const a1 = ((deg + 1.2 - 90) * Math.PI) / 180;
        ctx.beginPath();
        ctx.arc(CX, CY, OUTER, a0, a1);
        ctx.arc(CX, CY, INNER, a1, a0, true);
        ctx.closePath();
        ctx.fillStyle = `hsl(${deg}, ${state.saturation}%, 50%)`;
        ctx.fill();
      }
      for (const { hue } of getPalette()) {
        const a = ((hue - 90) * Math.PI) / 180;
        const mx = CX + ((OUTER + INNER) / 2) * Math.cos(a);
        const my = CY + ((OUTER + INNER) / 2) * Math.sin(a);
        ctx.beginPath();
        ctx.arc(mx, my, 7, 0, Math.PI * 2);
        ctx.fillStyle = hslToHex(hue, state.saturation, state.lightness);
        ctx.fill();
        ctx.strokeStyle = "#141414";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    function updateThumb() {
      const midR = (OUTER + INNER) / 2;
      const a = ((state.baseHue - 90) * Math.PI) / 180;
      const x = CX + midR * Math.cos(a);
      const y = CY + midR * Math.sin(a);
      thumb.style.left = `${(x / (SIZE * 2)) * 100}%`;
      thumb.style.top = `${(y / (SIZE * 2)) * 100}%`;
      thumb.style.background = hslToHex(state.baseHue, state.saturation, state.lightness);
    }

    function renderPatternToggle() {
      const container = document.getElementById("patternToggle");
      container.innerHTML = PATTERNS.map((p, i) =>
        `<button type="button" class="pattern-btn ${i === state.pattern ? "active" : ""}" data-i="${i}">${p.name}</button>`
      ).join("");
      container.querySelectorAll(".pattern-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.pattern = +btn.dataset.i;
          renderPatternToggle();
          render();
        });
      });
    }

    function bindCopy(root) {
      root.querySelectorAll(".swatch").forEach((el) => {
        el.addEventListener("click", async () => {
          await navigator.clipboard.writeText(el.dataset.hex);
          el.classList.add("copied");
          const hexSpan = el.querySelector(".hex");
          const prev = hexSpan ? hexSpan.textContent : "";
          if (hexSpan) {
            hexSpan.textContent = "copied";
            hexSpan.classList.add("copied");
          }
          setTimeout(() => {
            el.classList.remove("copied");
            if (hexSpan) {
              hexSpan.textContent = prev;
              hexSpan.classList.remove("copied");
            }
          }, 1200);
        });
      });
    }

    function renderOutput() {
      const name = PATTERNS[state.pattern].name;
      const colors = getPalette();
      document.getElementById("schemeLabel").textContent = name;
      const output = document.getElementById("output");
      output.style.setProperty("--swatch-count", String(colors.length));
      output.innerHTML = colors.map((c) =>
        `<button type="button" class="swatch" data-hex="${c.hex}" aria-label="Copy ${c.name} ${c.hex}" style="background:${c.hex};color:${captionInk(c.hex)}">
            <span class="swatch-name">${c.name}</span>
            <span class="hex">${c.hex}</span>
          </button>`
      ).join("");
      bindCopy(output);
    }

    function render() {
      drawRing();
      updateThumb();
      renderOutput();
      document.getElementById("satVal").textContent = fmtVal(state.saturation);
      document.getElementById("lightVal").textContent = fmtVal(state.lightness);
      document.getElementById("hueVal").textContent = `${fmtVal(state.baseHue)}°`;
      saveState();
    }

    function ringMetrics() {
      const rect = canvas.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const minR = (INNER / SIZE) * (rect.width / 2);
      const maxR = rect.width / 2;
      return { cx, cy, minR, maxR };
    }

    function isOnRing(clientX, clientY) {
      const { cx, cy, minR, maxR } = ringMetrics();
      const dist = Math.hypot(clientX - cx, clientY - cy);
      return dist >= minR * 0.72 && dist <= maxR * 1.1;
    }

    function pointerToHue(clientX, clientY) {
      const { cx, cy } = ringMetrics();
      let angle = (Math.atan2(clientY - cy, clientX - cx) * 180) / Math.PI + 90;
      if (angle < 0) angle += 360;
      return angle;
    }

    let dragging = false;
    let activePointerId = null;

    function startDrag(e) {
      if (!isOnRing(e.clientX, e.clientY)) return;
      dragging = true;
      activePointerId = e.pointerId;
      document.body.classList.add("dragging");
      ringWrap.classList.add("dragging");
      canvas.setPointerCapture(e.pointerId);
      state.baseHue = pointerToHue(e.clientX, e.clientY);
      render();
      e.preventDefault();
    }

    function moveDrag(e) {
      if (!dragging || e.pointerId !== activePointerId) return;
      state.baseHue = pointerToHue(e.clientX, e.clientY);
      render();
      e.preventDefault();
    }

    function endDrag(e) {
      if (activePointerId !== null && e.pointerId !== activePointerId) return;
      dragging = false;
      activePointerId = null;
      document.body.classList.remove("dragging");
      ringWrap.classList.remove("dragging");
      try { canvas.releasePointerCapture(e.pointerId); } catch {}
    }

    canvas.addEventListener("pointerdown", startDrag);
    canvas.addEventListener("pointermove", moveDrag);
    canvas.addEventListener("pointerup", endDrag);
    canvas.addEventListener("pointercancel", endDrag);
    window.addEventListener("pointermove", moveDrag);
    window.addEventListener("pointerup", endDrag);
    window.addEventListener("pointercancel", endDrag);

    document.getElementById("saturation").addEventListener("input", (e) => {
      state.saturation = parseFloat(e.target.value);
      render();
    });
    document.getElementById("lightness").addEventListener("input", (e) => {
      state.lightness = parseFloat(e.target.value);
      render();
    });

    loadState();
    applyStateToControls();
    renderPatternToggle();
    render();
  </script>
</body>
</html>
